name: omdb foundation

on:
  push:
    branches:
      - 'omdb/**'
      - master
    paths:
      - 'examples/omdb_lanes.rs'
      - 'src/**'
      - 'Cargo.toml'
      - 'crates/**'
      - 'tests/**'
      - 'build.rs'
      - 'justfile'
      - 'rust-toolchain'
      - 'Containerfile.sandbox'
      - 'scripts/**'
      - '.github/workflows/omdb-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omdb-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: --deny warnings
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal --component rustfmt,clippy
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes podman
          cargo install --locked --version 1.36.0 just
          cargo install --locked --version 0.20.2 cargo-deny
      - name: Run the repository-required test gate
        run: just test
      - name: Exercise the hosted lanes
        run: |
          cargo run -p redb@4.5.0 --example omdb_lanes --features experimental-api-5
      - name: Check the existing freestanding engine profile
        run: just build_no_std
