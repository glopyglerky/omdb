name: Checked open phase diagnostic

on:
  push:
    branches: ["measure/t3-checked-open-*"]

permissions:
  contents: read

jobs:
  checked-open:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      REDB_CHECKED_OPEN_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify checked open, alternate-root recovery and torn-slot refusal
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/checked-open-cargo"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/checked-open-target"
          evidence="$RUNNER_TEMP/checked-open-evidence"
          mkdir "$evidence"
          trap 'rm -rf -- "$CARGO_TARGET_DIR" "$CARGO_HOME"' EXIT
          git show -s --format='%H %T' > "$evidence/source.txt"
          rustup toolchain install 1.90.0 --profile minimal
          rustc +1.90.0 --version --verbose > "$evidence/compiler.txt"
          cargo +1.90.0 generate-lockfile
          sha256sum Cargo.lock > "$evidence/lock.sha256"
          if [[ "$GITHUB_REF_NAME" == measure/t3-checked-open-verified-pages-* ]]; then
            verify_case() {
              local features=$1 suite=$2 test_name=$3 log=$4
              cargo +1.90.0 test --locked -p redb@4.5.0 --features "$features" "$suite" \
                "$test_name" -- --nocapture --test-threads=1 2>&1 | tee "$log"
              grep -Eq 'test result: ok[.] 1 passed;' "$log"
            }
            for lane in control candidate; do
              features=checked_open_diagnostics
              if [[ "$lane" == candidate ]]; then features+=,checked_open_reuse_verified_pages; fi
              for test_name in \
                checked_open_rebuilds_normal_tables_and_recounts \
                checked_open_rebuilds_multimap_subtrees \
                checked_open_verifies_selected_roots_and_refuses_torn_backup \
                checked_open_refuses_corrupt_data_and_duplicate_allocations \
                checked_open_callbacks_abort_without_committing \
                repair_falls_back_to_secondary_on_invalid_primary_root \
                repair_does_not_fall_back_to_a_torn_secondary \
                mark_page_allocated_rejects_corrupt_page_numbers; do
                verify_case "$features" --lib "$test_name" "$evidence/$lane-$test_name.log"
              done
              cargo +1.90.0 test --locked -p redb@4.5.0 --features "$features" \
                --test integration_tests check_integrity_with_persistent_savepoint_then_restore \
                -- --test-threads=1 2>&1 | tee "$evidence/$lane-savepoint.log"
              grep -Eq 'test result: ok[.] 1 passed;' "$evidence/$lane-savepoint.log"
            done
            verify_case "$features" --lib checked_open_page_list_keeps_duplicates_and_discards_on_cap \
              "$evidence/candidate-cap.log"
            rustup target add --toolchain 1.90.0 thumbv7em-none-eabihf
            cargo +1.90.0 check --locked -p redb@4.5.0 --target thumbv7em-none-eabihf --no-default-features \
              --features experimental-api-5,checked_open_reuse_verified_pages

            phase_count() {
              awk -v phase="$1" -v field="$2" '
                index($0, "phase=" phase " ") {
                  for (i = 1; i <= NF; i++) if (index($i, field "=") == 1) {
                    print substr($i, length(field) + 2)
                    matches++
                  }
                }
                END { if (matches != 1) exit 1 }
              ' "$3"
            }
            normal=checked_open_rebuilds_normal_tables_and_recounts
            multi=checked_open_rebuilds_multimap_subtrees
            for field in backend_reads backend_bytes backend_read_errors; do
              for phase in VerifyCurrentRoots RebuildSystemAllocator MarkPinnedPages; do
                for test_name in "$normal" "$multi"; do
                  test "$(phase_count "$phase" "$field" "$evidence/candidate-$test_name.log")" \
                    -eq "$(phase_count "$phase" "$field" "$evidence/control-$test_name.log")"
                done
              done
              test "$(phase_count RebuildDataAllocator "$field" "$evidence/candidate-$multi.log")" \
                -eq "$(phase_count RebuildDataAllocator "$field" "$evidence/control-$multi.log")"
            done
            for field in backend_reads backend_bytes; do
              test "$(phase_count RebuildDataAllocator "$field" "$evidence/candidate-$normal.log")" \
                -lt "$(phase_count RebuildDataAllocator "$field" "$evidence/control-$normal.log")"
            done
            for lane in control candidate; do
              test "$(phase_count RebuildDataAllocator backend_read_errors "$evidence/$lane-$normal.log")" -eq 0
              log="$evidence/$lane-checked_open_verifies_selected_roots_and_refuses_torn_backup.log"
              test "$(grep -c 'phase=VerifyCurrentRoots ' "$log")" -eq 3
              test "$(grep -c 'phase=VerifyAlternateRoots ' "$log")" -eq 1
              test "$(grep -c 'phase=RebuildDataAllocator ' "$log")" -eq 2
            done
            exit 0
          fi
          cargo +1.90.0 test --locked -p redb@4.5.0 --features checked_open_diagnostics --lib \
            checked_open_verifies_selected_roots_and_refuses_torn_backup -- --nocapture --test-threads=1 \
            2>&1 | tee "$evidence/checked-open.log"
          test "$(grep -c 'phase=VerifyCurrentRoots ' "$evidence/checked-open.log")" -eq 3
          test "$(grep -c 'phase=VerifyAlternateRoots ' "$evidence/checked-open.log")" -eq 1
          test "$(grep -c 'phase=RebuildDataAllocator ' "$evidence/checked-open.log")" -eq 2
          cargo +1.90.0 test --locked -p redb@4.5.0 --features checked_open_diagnostics --lib \
            repair_falls_back_to_secondary_on_invalid_primary_root
          cargo +1.90.0 test --locked -p redb@4.5.0 --features checked_open_diagnostics --lib \
            repair_does_not_fall_back_to_a_torn_secondary
          cargo +1.90.0 test --locked -p redb@4.5.0 --features checked_open_diagnostics \
            --test integration_tests check_integrity_with_persistent_savepoint_then_restore
      - name: Retain diagnostic metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checked-open-diagnostic-evidence
          path: ${{ runner.temp }}/checked-open-evidence/
          if-no-files-found: error
          retention-days: 14
